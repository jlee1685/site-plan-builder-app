name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name SitePlanBuilder --add-data "web;web" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: SitePlanBuilder-windows
          path: dist/SitePlanBuilder.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SitePlanBuilder.exe
